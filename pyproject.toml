[project]
name = "autorun-audit"
version = "0.3.0"
description = "Find code that runs without you asking: Python startup files (.pth/.start) and repo files that execute when a folder is opened."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ag3nt Sc4rn" }]
requires-python = ">=3.11"
keywords = ["security", "supply-chain", "pth", "pep-829", "vscode", "mcp", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
autorun-audit = "autorun_audit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# The formatter keeps code within line-length; long string literals are left alone.
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
