name: Bug report
description: Something isn't working as documented, or a finding is wrong.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Ways to bypass detection are security issues: report them privately (see SECURITY.md).
        Please defang any payloads in examples (e.g. use example.invalid domains).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command you ran and a minimal file that triggers the problem.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: autorun-audit version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: "Python 3.13, macOS 26"
  - type: textarea
    id: output
    attributes:
      label: Output (preferably with --format json)
      render: text
