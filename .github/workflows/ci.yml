name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run --frozen pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run --frozen ruff check --output-format=github

      - name: Format
        run: uv run --frozen ruff format --check

      - name: Type check
        run: uv run --frozen mypy

      - name: Build
        run: uv build

      # Dogfood: the repo itself must not auto-run anything.
      - name: Audit this repo
        run: uv run --frozen autorun-audit repo . --fail-on medium

  action:
    # Exercises action.yml from this checkout: a clean directory passes, a malicious one fails.
    name: action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: clean
        uses: ./
        with:
          path: tests/fixtures/action-clean
          upload-sarif: "false"

      - id: dirty
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/action-folder-open
          upload-sarif: "false"

      - name: Check outcomes
        env:
          CLEAN: ${{ steps.clean.outcome }}
          DIRTY: ${{ steps.dirty.outcome }}
          SARIF: ${{ steps.dirty.outputs.sarif-file }}
        run: |
          echo "clean=$CLEAN dirty=$DIRTY"
          test "$CLEAN" = success
          test "$DIRTY" = failure
          grep -q '"vscode.task.folder-open"' "$SARIF"

  ci:
    # This job name is the required status check in the main branch ruleset. Keep it stable.
    name: ci
    if: always()
    needs: [test, lint, action]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed: $RESULTS"
              exit 1
            fi
          done
